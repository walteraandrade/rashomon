name: ingest

# Collects every 6 hours into the managed Postgres behind production. GKG_SLOTS=28
# looks back 7 hours, so one missed run still leaves no gap. Runs never overlap:
# each one is a long-lived pg session doing bulk inserts and an ANALYZE. A full run
# takes ~25 min, ~20 of them Bluesky (which defaultSources runs last).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Space-separated sources (empty = default set)'
        required: false
        default: ''

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      GKG_SLOTS: 28
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -n "$DATABASE_URL" || { echo 'DATABASE_URL secret is missing'; exit 1; }
      - run: pnpm ingest ${{ inputs.sources }}
