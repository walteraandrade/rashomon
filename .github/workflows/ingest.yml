name: ingest

# Collects every 6 hours into the managed Postgres behind production. GKG_SLOTS=28
# looks back 7 hours, so one missed run still leaves no gap. Runs never overlap:
# each one is a long-lived pg session doing bulk inserts and an ANALYZE. A full run
# takes ~25 min, ~20 of them Bluesky (which defaultSources runs last), plus the score
# of the new pairs.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Space-separated sources (empty = default set)'
        required: false
        default: ''

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PG_SSL_CA: ${{ secrets.PG_SSL_CA }}
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      GKG_SLOTS: 28
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TESTIMONY_MODEL: drifting-walter/kikori
      # Must equal the Vercel project's value: it is part of the testimony `method`, the label
      # `pnpm score` writes and part of every stored key. TESTIMONY_DTYPE stays unset on both sides
      # (the default, q8).
      TESTIMONY_REVISION: ${{ vars.TESTIMONY_REVISION }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -n "$DATABASE_URL" || { echo 'DATABASE_URL secret is missing'; exit 1; }
      - run: test -n "$PG_SSL_CA" || { echo 'PG_SSL_CA secret is missing'; exit 1; }
      - run: pnpm ingest ${{ inputs.sources }}
      # The q8 model files of that revision (~110 MB), in MODEL_DIR's default. Saved only when the
      # job succeeds, so a download cut by the timeout below is never cached.
      - uses: actions/cache@v4
        with:
          path: data/models
          key: kikori-q8-${{ vars.TESTIMONY_REVISION }}
      # Scores the pairs this ingest added, before materialize reads doc_testimony into the warm
      # bodies. Nothing else writes doc_testimony, and retention deletes a doc's rows with the doc,
      # so without this step the page loses its colours within 21 days. A backlog stops at the
      # timeout and resumes on the next run: rows land 500 per insert. continue-on-error so a Hub
      # outage never skips materialize, purge and warm; the last step fails the job afterwards.
      - run: pnpm score
        id: score
        continue-on-error: true
        timeout-minutes: 10
      # Writes the warm recortes' response bodies to the warm_entries table. continue-on-error and
      # its own timeout: a failed or slow store step must not skip the cache purge and warm below.
      - run: pnpm materialize
        continue-on-error: true
        timeout-minutes: 20
      # Read-only: table sizes and the database total, so a shrinking-disk trend shows up in
      # the run summary without opening a database client. continue-on-error: a transient
      # failure here must not skip the cache purge/warm below and leave production serving
      # the pre-ingest CDN copy; the closing fence is written even when `pnpm size` fails, and
      # the step still reports its failure.
      - run: |
          { echo '```'; pnpm -s size; s=$?; echo '```'; exit $s; } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      # Drops every stored /api object (the `api` tag, src/cache.ts) so the warm below refills
      # them from the origin: no request header bypasses Vercel's CDN, and a plain GET after an
      # ingest would only confirm the pre-ingest copy.
      - run: test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is missing'; exit 1; }
      - run: pnpm dlx vercel@59 cache dangerously-delete --tag api --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: team_JKYixYXuTf1hPPPIDJbDR75g
          VERCEL_PROJECT_ID: prj_ICBXfo5zxV5UnC8wkMPbNKh0J2rT
      - run: pnpm warm
        env:
          SITE_URL: https://rashomon-five.vercel.app
      # A failed or timed-out score turns the run red here, after the site is refreshed, instead of
      # leaving unscored pairs that only show up as uncoloured words on the page.
      - if: steps.score.outcome == 'failure'
        run: echo '::error::pnpm score failed or timed out, so some pairs have no testimony row' && exit 1
