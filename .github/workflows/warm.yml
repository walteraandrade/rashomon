name: warm

# A deploy empties the CDN cache, so the first reader of every recorte would pay the origin
# until the next ingest. This asks for the page's own recortes right after production is up.
# Before asking, it builds the graph aggregates when the database has none (the first deploy
# after the tables appeared): otherwise every warm GET would be the live 7 s statement.
# Same concurrency group as ingest: two aggregate builds on one database would collide.
on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  warm:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PG_SSL_CA: ${{ secrets.PG_SSL_CA }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      WARM_STORE_URL: ${{ vars.WARM_STORE_URL }}
      # Must equal the Vercel project's value: it is part of the testimony `method`, which is part
      # of every stored key. TESTIMONY_DTYPE stays unset on both sides (the default, q8).
      TESTIMONY_REVISION: ${{ vars.TESTIMONY_REVISION }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -n "$DATABASE_URL" || { echo 'DATABASE_URL secret is missing'; exit 1; }
      - run: test -n "$PG_SSL_CA" || { echo 'PG_SSL_CA secret is missing'; exit 1; }
      - run: pnpm aggregate --if-missing
      # Fills the warm store when it is empty or older than the last build (the first deploy after
      # it shipped, a wiped store); a deploy alone never invalidates it. Same guards as in ingest.yml.
      - run: pnpm materialize --if-stale
        continue-on-error: true
        timeout-minutes: 15
      # Drops every stored /api object (the `api` tag, src/cache.ts) so the warm below refills
      # them from the origin: no request header bypasses Vercel's CDN, and a plain GET after an
      # ingest would only confirm the pre-ingest copy.
      - run: test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is missing'; exit 1; }
      - run: pnpm dlx vercel@59 cache dangerously-delete --tag api --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: team_JKYixYXuTf1hPPPIDJbDR75g
          VERCEL_PROJECT_ID: prj_ICBXfo5zxV5UnC8wkMPbNKh0J2rT
      - run: pnpm warm
        env:
          SITE_URL: https://rashomon-five.vercel.app
