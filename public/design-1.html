<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rashomon — editorial</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121014;
    --bg-raised: #19171c;
    --ink: #ece7dd;
    --muted: #928c7d;
    --muted-2: #635e54;
    --hair: #2c2924;
    --accent: #c9924f;
    --person: #f2c744;
    --hashtag: #5fd9a4;
    --word: #6c93f5;
    --theme: #e58fc0;
    --tone-neg: #e8677e;
    --tone-mid: #55524a;
    --tone-pos: #7bd88f;
    --link: #3a352c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 Inter, system-ui, sans-serif;
    display: grid; grid-template-rows: auto auto auto 1fr;
  }
  ::selection { background: var(--accent); color: #201a10; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 32px 14px; }
  .brand { font: 700 15px/1 'League Spartan', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
  .brand small { color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: none; margin-left: 10px; }
  .rule { height: 1px; background: var(--hair); margin: 0 32px; }

  .lede { padding: 28px 32px 22px; max-width: 900px; }
  h1.sentence {
    margin: 0; font: 600 clamp(26px, 3.6vw, 42px)/1.35 'League Spartan', sans-serif;
    letter-spacing: -0.005em; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .pick { position: relative; display: inline-block; margin: 0 1px; }
  .pick select {
    appearance: none; -webkit-appearance: none;
    background: transparent; color: var(--ink);
    font: inherit; font-weight: 700; border: none;
    border-bottom: 2px dotted var(--accent);
    padding: 0 20px 2px 3px; margin: 0; cursor: pointer;
    border-radius: 3px 3px 0 0;
  }
  .pick select:hover { background: var(--bg-raised); }
  .pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; background: var(--bg-raised); }
  .pick::after {
    content: ''; position: absolute; right: 6px; top: 46%; width: 6px; height: 6px;
    border-right: 1.5px solid var(--accent); border-bottom: 1.5px solid var(--accent);
    transform: translateY(-60%) rotate(45deg); pointer-events: none;
  }
  .pick select option { background: var(--bg-raised); color: var(--ink); font-weight: 500; }

  .adjustrow { display: flex; align-items: center; gap: 14px; margin-top: 14px; position: relative; }
  details.adjust summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font: 500 12px/1 Inter, sans-serif; color: var(--muted); letter-spacing: .04em;
    padding: 6px 10px; border: 1px solid var(--hair); border-radius: 999px;
  }
  details.adjust summary::-webkit-details-marker { display: none; }
  details.adjust summary:hover { color: var(--ink); border-color: var(--muted-2); }
  details.adjust[open] summary { color: var(--ink); border-color: var(--accent); }
  details.adjust .panel {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 20;
    background: var(--bg-raised); border: 1px solid var(--hair); border-radius: 10px;
    padding: 14px 16px; display: grid; gap: 12px; min-width: 220px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
  }
  .field { display: grid; gap: 4px; }
  .field span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .field input[type=number] {
    background: var(--bg); color: var(--ink); border: 1px solid var(--hair); border-radius: 6px;
    padding: 6px 8px; font: inherit; font-variant-numeric: tabular-nums; width: 100%;
  }
  .field input[type=number]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .togglerow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
  .togglerow input { accent-color: var(--accent); }

  p.dek { margin: 14px 0 0; color: var(--muted); font-size: 14.5px; max-width: 70ch; font-variant-numeric: tabular-nums; }

  main { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 300px; border-top: 1px solid var(--hair); }
  #graph { position: relative; overflow: hidden; min-height: 66vh; background: var(--bg); }
  svg { width: 100%; height: 100%; display: block; }
  .node text { fill: var(--ink); pointer-events: none; font-size: 12px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; font-family: Inter, sans-serif; }
  .node.person text { font: 700 17px 'League Spartan', sans-serif; }
  .node { transition: opacity .12s; }
  .link { transition: opacity .12s, stroke .12s; stroke-linecap: round; }

  #tip {
    position: absolute; display: none; background: var(--bg-raised); border: 1px solid var(--hair);
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; pointer-events: none; max-width: 220px;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  #tip b { color: var(--ink); font-family: 'League Spartan', sans-serif; }
  #tip span { color: var(--muted); }

  #legend { position: absolute; left: 20px; bottom: 16px; display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; max-width: calc(100% - 40px); }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #legend .hint { flex-basis: 100%; color: var(--muted); }
  #empty { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); text-align: center; font-size: 14px; }
  #empty code { background: var(--bg-raised); border: 1px solid var(--hair); border-radius: 4px; padding: 2px 6px; font-family: ui-monospace, monospace; color: var(--ink); }

  aside { border-left: 1px solid var(--hair); background: var(--bg-raised); overflow-y: auto; }
  .side-head {
    display: flex; align-items: baseline; gap: 6px; margin: 0; padding: 16px 18px 10px;
    font: 600 13px 'League Spartan', sans-serif; letter-spacing: .04em; color: var(--ink);
    border-bottom: 1px solid var(--hair); text-transform: uppercase;
  }
  .side-head span { text-transform: none; color: var(--muted); font-family: Inter, sans-serif; font-weight: 500; font-size: 12px; }

  .src-all {
    display: flex; justify-content: space-between; padding: 10px 18px; cursor: pointer;
    font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--hair);
  }
  .src-all:hover { color: var(--ink); }
  .src-all.active { color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); background: var(--bg); }
  .src-all .n { font-variant-numeric: tabular-nums; }

  .src {
    display: grid; grid-template-columns: 20px 1fr 8px; gap: 10px; align-items: center;
    padding: 9px 18px; cursor: pointer;
  }
  .src:hover { background: var(--bg); }
  .src.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  .src .rank { font: 600 11px/1 'League Spartan', sans-serif; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .src .row1 { display: flex; justify-content: space-between; gap: 8px; }
  .src .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .src .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; flex: none; }
  .src .bar { height: 2px; background: var(--hair); margin-top: 5px; border-radius: 2px; overflow: hidden; }
  .src .bar i { display: block; height: 100%; background: var(--muted-2); }
  .src .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hair); border: 1px solid var(--hair); }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { max-height: 38vh; border-left: 0; border-top: 1px solid var(--hair); }
    .masthead, .lede { padding-left: 18px; padding-right: 18px; }
    .rule { margin: 0 18px; }
    #graph { min-height: 52vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    .node, .link { transition: none !important; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="brand">rashomon <small>mapa de associações</small></div>
</header>
<div class="rule"></div>

<section class="lede">
  <h1 class="sentence">
    <span class="pick"><select id="person" aria-label="pessoa"></select></span>
    nos últimos
    <span class="pick"><select id="days" aria-label="janela de dias">
      <option value="7">7 dias</option>
      <option value="30" selected>30 dias</option>
      <option value="90">90 dias</option>
      <option value="365">365 dias</option>
    </select></span>,
    em
    <span class="pick"><select id="source" aria-label="fonte">
      <option value="all">todas as fontes</option>
      <option value="bluesky">bluesky</option>
      <option value="gdelt">gdelt</option>
      <option value="rss">rss</option>
      <option value="gnews">google news</option>
      <option value="gkg">gdelt gkg</option>
    </select></span>,
    por
    <span class="pick"><select id="sort" aria-label="ordenação">
      <option value="count">contagem</option>
      <option value="pmi">pmi</option>
    </select></span>,
    exibindo
    <span class="pick"><select id="kind" aria-label="tipo de termo">
      <option value="all">todos os tipos</option>
      <option value="hashtag">hashtags</option>
      <option value="word">palavras</option>
      <option value="theme">temas</option>
    </select></span>.
  </h1>
  <div class="adjustrow">
    <details class="adjust" id="adjust">
      <summary>ajustes</summary>
      <div class="panel">
        <label class="field"><span>Nós no grafo</span><input id="limit" type="number" value="40" min="5" max="200"></label>
        <label class="field"><span>Mínimo de docs</span><input id="min" type="number" value="2" min="1"></label>
        <label class="togglerow"><input id="tone" type="checkbox"> cor por tom</label>
      </div>
    </details>
  </div>
  <p class="dek" id="stats"></p>
</section>

<main>
  <div id="graph">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tip"></div>
    <div id="empty">nada nessa janela. roda&nbsp;<code>pnpm ingest</code></div>
    <div id="legend">
      <span><i style="background:var(--person)"></i>pessoa</span>
      <span><i style="background:var(--hashtag)"></i>hashtag</span>
      <span><i style="background:var(--word)"></i>palavra</span>
      <span><i style="background:var(--theme)"></i>tema</span>
      <span id="tonelegend" hidden><i style="background:var(--tone-neg)"></i>tom negativo&nbsp; <i style="background:var(--tone-pos)"></i>tom positivo</span>
    </div>
  </div>
  <aside>
    <div class="side-head">Fontes <span id="domainlabel"></span></div>
    <div id="sources"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id)
  const controls = ['person', 'days', 'source', 'kind', 'sort', 'limit', 'min']
  let domain = 'all'
  const toneScale = d3.scaleLinear().domain([-3, 0, 3]).range(['#e8677e', '#55524a', '#7bd88f']).clamp(true)
  const toneColor = (t) => (t === null || t === undefined ? null : toneScale(t))
  const kindColor = { person: 'var(--person)', hashtag: 'var(--hashtag)', word: 'var(--word)', theme: 'var(--theme)' }
  const nodeColor = (n) => ($('tone').checked && n.kind !== 'person' && n.tone !== null && n.tone !== undefined ? toneScale(n.tone) : kindColor[n.kind])
  const svg = d3.select('svg')
  const tip = $('tip')
  let sim = null
  let nodeSel = null
  let linkSel = null

  let linkData = []
  const idOf = (x) => String(x.id ?? x)
  const isSpoke = (l) => idOf(l.source).startsWith('person:')
  const linkIsTouching = (l, id) => idOf(l.source) === id || idOf(l.target) === id

  const setHighlight = (id) => {
    const neighbors = new Set()
    if (id) linkData.forEach((l) => { if (!isSpoke(l) && linkIsTouching(l, id)) { neighbors.add(idOf(l.source)); neighbors.add(idOf(l.target)) } })
    if (nodeSel) nodeSel.style('opacity', (n) => (!id || n.kind === 'person' || n.id === id || neighbors.has(n.id) ? 1 : 0.15))
    if (linkSel) {
      linkSel
        .style('opacity', (l) => {
          if (!id) return isSpoke(l) ? 0.45 : 0
          if (linkIsTouching(l, id)) return isSpoke(l) ? 0.7 : 0.9
          return isSpoke(l) ? 0.06 : 0
        })
        .attr('stroke', (l) => (id && !isSpoke(l) && linkIsTouching(l, id) ? 'var(--accent)' : 'var(--link)'))
    }
  }

  const params = () => ({ ...Object.fromEntries(controls.map((c) => [c, $(c).value])), domain })
  let requestId = 0

  const load = async () => {
    const { person, ...q } = params()
    if (!person) return
    const id = ++requestId
    try {
      const res = await fetch(`/api/people/${person}/graph?` + new URLSearchParams(q))
      const g = await res.json()
      if (id !== requestId) return
      render(g)
      const srcs = await (await fetch(`/api/people/${person}/sources?` + new URLSearchParams(q))).json()
      if (id === requestId) renderSources(srcs)
    } catch (e) {
      $('stats').textContent = `erro: ${e.message}`
    }
  }

  const renderSources = (rows) => {
    $('domainlabel').textContent = domain === 'all' ? '' : `· ${domain}`
    const total = rows.reduce((a, r) => a + r.docs, 0)
    const ranked = [...rows].sort((a, b) => b.docs - a.docs)
    const maxDocs = d3.max(ranked, (r) => r.docs) || 1
    const box = $('sources')
    box.innerHTML = `
      <div class="src-all ${domain === 'all' ? 'active' : ''}" data-domain=""><span>todas as fontes</span><span class="n">${total}</span></div>
      ${ranked.map((r, i) => {
        const label = r.domain ?? r.source ?? 'desconhecido'
        const tc = toneColor(r.tone)
        const pct = Math.max(4, Math.round((r.docs / maxDocs) * 100))
        return `<div class="src ${r.domain === domain ? 'active' : ''}" data-domain="${r.domain ?? ''}" title="${r.source ?? ''}">
          <span class="rank">${String(i + 1).padStart(2, '0')}</span>
          <div class="body">
            <div class="row1"><span class="d">${label}</span><span class="n">${r.docs}</span></div>
            <div class="bar"><i style="width:${pct}%;background:${tc ?? 'var(--muted-2)'}"></i></div>
          </div>
          <span class="dot" style="${tc ? `background:${tc};border-color:${tc}` : ''}"></span>
        </div>`
      }).join('')}`
    box.querySelectorAll('[data-domain]').forEach((el) => el.addEventListener('click', () => {
      const d = el.dataset.domain
      domain = !d || d === domain ? 'all' : d
      load()
    }))
  }

  const render = (g) => {
    if (sim) sim.stop()
    svg.selectAll('*').remove()
    $('stats').textContent = `${g.stats.about} docs sobre ${g.person.name} de ${g.stats.docs} na janela`
    $('empty').style.display = g.nodes.length ? 'none' : 'grid'
    const [width, height] = [1200, 700]
    const cx = width / 2, cy = height / 2
    const maxCount = d3.max(g.nodes, (n) => n.count) || 1
    const r = d3.scaleSqrt().domain([1, maxCount]).range([4, 18])
    const personR = 28
    const n = g.nodes.length
    // Ring radius encodes rank by the active sort: closer to the center = stronger association.
    // Angle follows the golden angle so consecutive ranks land far apart and the layout is deterministic.
    const ring = d3.scaleLinear().domain([0, Math.max(1, n - 1)]).range([120, 310])
    const golden = Math.PI * (3 - Math.sqrt(5))
    const nodes = [
      { id: `person:${g.person.id}`, kind: 'person', term: g.person.name, fx: cx, fy: cy, x: cx, y: cy },
      ...g.nodes.map((d, i) => ({ ...d, rank: i, x: cx + ring(i) * Math.cos(i * golden), y: cy + ring(i) * Math.sin(i * golden) })),
    ]
    const byId = new Map(nodes.map((d) => [d.id, d]))
    const links = g.links.map((l) => ({ ...l, source: byId.get(l.source), target: byId.get(l.target) })).filter((l) => l.source && l.target)
    linkData = links
    const maxLink = d3.max(links.filter((l) => !isSpoke(l)), (l) => l.count) || 1
    const root = svg.append('g')
    svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', (e) => root.attr('transform', e.transform)))

    linkSel = root.append('g').selectAll('line').data(links).join('line')
      .attr('class', 'link')
      .attr('stroke', 'var(--link)')
      .attr('stroke-width', (l) => (isSpoke(l) ? 1 : 1 + 3 * Math.sqrt(l.count / maxLink)))
      .style('opacity', (l) => (isSpoke(l) ? 0.45 : 0))

    nodeSel = root.append('g').selectAll('g').data(nodes).join('g').attr('class', (d) => `node ${d.kind}`)
    nodeSel.append('circle').attr('r', (d) => (d.kind === 'person' ? personR : r(d.count))).attr('fill', nodeColor)
    nodeSel.append('text').text((d) => (d.kind === 'hashtag' ? `#${d.term}` : d.term))
    const placeLabels = () => nodeSel.select('text')
      .attr('text-anchor', (d) => (d.kind === 'person' ? 'middle' : d.x >= cx ? 'start' : 'end'))
      .attr('dx', (d) => (d.kind === 'person' ? 0 : (d.x >= cx ? 1 : -1) * (r(d.count) + 5)))
      .attr('dy', (d) => (d.kind === 'person' ? personR + 18 : 4))

    nodeSel.on('mousemove', (e, d) => {
      if (d.kind === 'person') return
      tip.style.display = 'block'
      const box = tip.parentElement.getBoundingClientRect()
      tip.style.left = e.clientX - box.left + 14 + 'px'; tip.style.top = e.clientY - box.top + 14 + 'px'
      const co = links.filter((l) => !isSpoke(l) && linkIsTouching(l, d.id)).length
      tip.innerHTML = `<b>${d.kind === 'hashtag' ? '#' : ''}${d.term}</b><br><span>docs</span> ${d.count} &nbsp; <span>pmi</span> ${d.pmi}${d.tone === null || d.tone === undefined ? '' : ` &nbsp; <span>tom</span> ${d.tone}`}<br><span>aparece junto com</span> ${co} ${co === 1 ? 'termo' : 'termos'} da lista`
    }).on('mouseenter', (e, d) => { if (d.kind !== 'person') setHighlight(d.id) })
      .on('mouseleave', () => { tip.style.display = 'none'; setHighlight(null) })

    const tick = () => {
      linkSel.attr('x1', (l) => l.source.x).attr('y1', (l) => l.source.y).attr('x2', (l) => l.target.x).attr('y2', (l) => l.target.y)
      nodeSel.attr('transform', (d) => `translate(${d.x},${d.y})`)
      placeLabels()
    }

    nodeSel.call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); if (d.kind !== 'person') { d.fx = null; d.fy = null } }))

    sim = d3.forceSimulation(nodes)
      .force('ring', d3.forceRadial((d) => (d.kind === 'person' ? 0 : ring(d.rank)), cx, cy).strength((d) => (d.kind === 'person' ? 0 : 0.9)))
      .force('together', d3.forceLink(links.filter((l) => !isSpoke(l))).id((d) => d.id).strength(0.015).distance(90))
      .force('collide', d3.forceCollide((d) => (d.kind === 'person' ? personR + 30 : r(d.count) + 20)).iterations(4))
      .on('tick', tick)
      .stop()
    sim.tick(300)
    tick()
    sim.alpha(0)

    d3.select('#legend').selectAll('.hint').data([0]).join('span').attr('class', 'hint')
      .text('perto do centro = associação mais forte · passe o mouse num termo para ver com quais ele aparece junto')
  }

  const closeAdjustOnOutsideClick = (e) => {
    const d = $('adjust')
    if (d.open && !d.contains(e.target)) d.open = false
  }

  const init = async () => {
    const people = await (await fetch('/api/people')).json()
    $('person').innerHTML = people.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')
    $('person').addEventListener('change', () => { domain = 'all'; load() })
    controls.filter((c) => c !== 'person').forEach((c) => $(c).addEventListener('change', load))
    $('limit').addEventListener('input', () => load())
    $('min').addEventListener('input', () => load())
    $('tone').addEventListener('change', () => {
      $('tonelegend').hidden = !$('tone').checked
      svg.selectAll('.node circle').attr('fill', nodeColor)
    })
    document.addEventListener('click', closeAdjustOnOutsideClick)
    load()
  }
  init()
</script>
</body>
</html>
