<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rashomon · analista</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17140f;
    --bg2: #1d1912;
    --bg3: #251f16;
    --line: #3a3325;
    --line2: #2a2418;
    --fg: #efe8d8;
    --muted: #a89b83;
    --muted2: #776a53;
    --accent: #eab54a;
    --accent-ink: #241c0c;
    --person: #eab54a;
    --hashtag: #6fc9a0;
    --word: #86a9d6;
    --theme: #d98bb0;
    --link: #46402f;
    --tone-neg: #e2725b;
    --tone-pos: #8fae6b;
    --tone-mid: #7d735c;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 13px/1.5 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  .sidebar {
    background: var(--bg2); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
    overflow-y: auto;
  }
  .brand {
    padding: 16px 16px 8px; font: 700 15px/1 'League Spartan', sans-serif;
    letter-spacing: .02em; color: var(--fg); flex: 0 0 auto;
  }
  .brand span { color: var(--muted2); font: 400 11px Inter; margin-left: 6px; }

  .people { padding: 8px 8px 4px; flex: 0 0 auto; }
  .person-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; color: var(--muted);
    padding: 8px 8px; border-radius: var(--radius); cursor: pointer;
    font: 500 13px Inter; text-align: left;
  }
  .person-item:hover { background: var(--bg3); color: var(--fg); }
  .person-item .dot {
    width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid var(--muted2); box-sizing: border-box;
  }
  .person-item.active { background: var(--bg3); color: var(--fg); }
  .person-item.active .dot { border-color: var(--accent); background: var(--accent); }

  .filters { padding: 8px 16px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .field { margin-top: 16px; }
  .field:first-child { margin-top: 0; }
  .field-label {
    display: flex; align-items: center; justify-content: space-between;
    font: 600 10.5px Inter; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted2); margin-bottom: 6px;
  }
  .badge {
    font: 600 11px/1 Inter; font-variant-numeric: tabular-nums;
    background: var(--bg3); color: var(--fg); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 8px; letter-spacing: 0; text-transform: none;
  }

  .segmented { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; gap: 2px; }
  .segmented button {
    flex: 1; background: transparent; border: none; color: var(--muted);
    font: 500 12px Inter; padding: 6px 4px; border-radius: 6px; cursor: pointer;
  }
  .segmented button:hover { color: var(--fg); }
  .segmented button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .select-wrap { position: relative; }
  select.select {
    width: 100%; appearance: none; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 30px 8px 10px;
    font: 500 12.5px Inter; cursor: pointer;
  }
  select.select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .select-wrap::after {
    content: ''; position: absolute; right: 10px; top: 50%; width: 7px; height: 7px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: translateY(-65%) rotate(45deg); pointer-events: none;
  }

  input[type="range"] {
    width: 100%; appearance: none; height: 4px; background: var(--line);
    border-radius: 999px; margin-top: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg2); cursor: pointer; margin-top: -1px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--bg2); cursor: pointer;
  }

  .switch-label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .switch-label span:first-child { font: 500 12.5px Inter; color: var(--fg); }
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .track {
    position: absolute; inset: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; transition: background .15s;
  }
  .switch .track::before {
    content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%;
    left: 2px; top: 2px; background: var(--muted2); transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: var(--bg3); border-color: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(14px); background: var(--accent); }

  .terms { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .terms-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 16px 8px; flex: 0 0 auto;
  }
  .terms-head h2 {
    margin: 0; font: 600 11px Inter; text-transform: uppercase; letter-spacing: .08em; color: var(--muted2);
  }
  .terms-count { font: 500 11px Inter; color: var(--muted2); font-variant-numeric: tabular-nums; }
  .terms-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; padding: 0 8px 12px; }
  .term-row {
    display: grid; grid-template-columns: 8px 1fr 64px auto 8px;
    align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: default;
  }
  .term-row:hover, .term-row.active { background: var(--bg3); }
  .term-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .term-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 500 12.5px Inter; color: var(--fg);
  }
  .term-bar-wrap { width: 64px; height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .term-bar { height: 100%; border-radius: 999px; min-width: 3px; }
  .term-value { font: 500 12px Inter; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  .term-tone { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .terms-empty { padding: 16px; color: var(--muted2); font-size: 12px; }

  /* ---------- main ---------- */
  .content { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .graph-panel { flex: 1 1 60%; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .graph-header { padding: 20px 24px 8px; flex: 0 0 auto; }
  .graph-header h1 { margin: 0; font: 700 26px/1.1 'League Spartan', sans-serif; letter-spacing: .01em; }
  .stats { margin-top: 4px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .graph-wrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  .node text { fill: var(--fg); pointer-events: none; font-size: 12px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node.person text { font: 700 16px 'League Spartan', sans-serif; }
  .node { transition: opacity .12s; }
  .link { transition: opacity .12s, stroke .12s; stroke-linecap: round; }
  #legend .hint { flex-basis: 100%; color: var(--muted); }

  #tip {
    position: absolute; display: none; background: var(--bg2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 10px; font-size: 12px; pointer-events: none;
    box-shadow: 0 8px 24px rgb(0 0 0 / .35);
  }
  #tip b { color: var(--fg); } #tip span { color: var(--muted); }

  #legend {
    position: absolute; left: 24px; bottom: 12px; display: flex; gap: 14px;
    font-size: 11.5px; color: var(--muted); flex-wrap: wrap;
  }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  #empty {
    position: absolute; inset: 0; display: none; place-items: center; color: var(--muted);
    text-align: center; padding: 24px; font-size: 13px;
  }
  #empty code { background: var(--bg3); padding: 2px 6px; border-radius: 4px; color: var(--fg); }

  .sources-strip { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--bg2); }
  .sources-head {
    display: flex; align-items: baseline; gap: 8px; padding: 10px 24px 0;
    font: 600 11px Inter; text-transform: uppercase; letter-spacing: .08em; color: var(--muted2);
  }
  .sources-head .domain-label { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; }
  .sources-row {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 24px 16px;
    max-height: 132px; overflow-y: auto;
  }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 8px;
    background: var(--bg3); border: 1px solid var(--line); border-left: 3px solid var(--muted2);
    border-radius: 7px; cursor: pointer; font-size: 12px; color: var(--muted); max-width: 220px;
  }
  .chip:hover { color: var(--fg); border-color: var(--muted2); }
  .chip.active { background: var(--accent); border-color: var(--accent); border-left-color: var(--accent-ink); color: var(--accent-ink); font-weight: 600; }
  .chip .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .chip .t {
    width: 26px; text-align: center; border-radius: 4px; padding: 1px 0;
    font-variant-numeric: tabular-nums; font-size: 10.5px; flex: 0 0 auto;
  }
  .chip.active .t { filter: brightness(.75); }
  .chip .t:empty { visibility: hidden; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    .sidebar { max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .content { min-height: 60vh; }
    .graph-panel { flex-basis: 420px; }
    .graph-header h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">rashomon <span>analista</span></div>
    <section class="people" id="people"></section>

    <section class="filters">
      <div class="field">
        <label class="field-label">Janela</label>
        <div class="segmented" id="days">
          <button data-value="7">7d</button>
          <button data-value="30">30d</button>
          <button data-value="90">90d</button>
          <button data-value="365">1a</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="source-select">Fonte</label>
        <div class="select-wrap">
          <select class="select" id="source-select">
            <option value="all">todas</option>
            <option value="bluesky">bluesky</option>
            <option value="gdelt">gdelt</option>
            <option value="rss">rss</option>
            <option value="gnews">google news</option>
            <option value="gkg">gdelt gkg</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Tipo</label>
        <div class="segmented" id="kind">
          <button data-value="all">todos</button>
          <button data-value="hashtag">hashtag</button>
          <button data-value="word">palavra</button>
          <button data-value="theme">tema</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Ordem</label>
        <div class="segmented" id="sort">
          <button data-value="count">contagem</button>
          <button data-value="pmi">pmi</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="limit-range">Nós <span class="badge" id="limit-badge">40</span></label>
        <input type="range" id="limit-range" min="5" max="200" step="5" value="40">
      </div>

      <div class="field">
        <label class="field-label" for="min-range">Mín. <span class="badge" id="min-badge">2</span></label>
        <input type="range" id="min-range" min="1" max="30" step="1" value="2">
      </div>

      <div class="field">
        <label class="switch-label" for="tone">
          <span>Cor por tom</span>
          <span class="switch"><input type="checkbox" id="tone"><span class="track"></span></span>
        </label>
      </div>
    </section>

    <section class="terms">
      <div class="terms-head">
        <h2>Termos</h2>
        <span class="terms-count" id="terms-count"></span>
      </div>
      <div class="terms-list" id="terms"></div>
    </section>
  </aside>

  <main class="content">
    <div class="graph-panel">
      <div class="graph-header">
        <h1 id="person-name">&nbsp;</h1>
        <div id="stats" class="stats"></div>
      </div>
      <div class="graph-wrap">
        <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="tip"></div>
        <div id="empty">nada nessa janela. roda <code>pnpm ingest</code></div>
        <div id="legend">
          <span><i style="background:var(--person)"></i>pessoa</span>
          <span><i style="background:var(--hashtag)"></i>hashtag</span>
          <span><i style="background:var(--word)"></i>palavra</span>
          <span><i style="background:var(--theme)"></i>tema</span>
          <span id="tonelegend" hidden><i style="background:var(--tone-neg)"></i>tom negativo &nbsp;<i style="background:var(--tone-pos)"></i>tom positivo</span>
        </div>
      </div>
    </div>

    <div class="sources-strip">
      <div class="sources-head">Fontes <span class="domain-label" id="domainlabel"></span></div>
      <div class="sources-row" id="sources"></div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id)

  const state = { person: null, days: '30', source: 'all', kind: 'all', sort: 'count', limit: 40, min: 2, tone: false, domain: 'all' }

  const toneScale = d3.scaleLinear().domain([-3, 0, 3]).range(['var(--tone-neg)', 'var(--tone-mid)', 'var(--tone-pos)']).clamp(true)
  const toneColor = (t) => (t === null || t === undefined ? 'var(--line)' : toneScale(t))
  const kindColor = { person: 'var(--person)', hashtag: 'var(--hashtag)', word: 'var(--word)', theme: 'var(--theme)' }
  const nodeColor = (n) => (state.tone && n.kind !== 'person' && n.tone !== null && n.tone !== undefined ? toneScale(n.tone) : kindColor[n.kind])

  const svg = d3.select('svg')
  const tip = $('tip')
  let sim = null
  let nodeSel = null
  let linkSel = null
  let hoveredId = null

  let linkData = []
  const idOf = (x) => String(x.id ?? x)
  const isSpoke = (l) => idOf(l.source).startsWith('person:')
  const linkIsTouching = (l, id) => idOf(l.source) === id || idOf(l.target) === id

  const setHighlight = (id, { scroll } = {}) => {
    hoveredId = id
    const neighbors = new Set()
    if (id) linkData.forEach((l) => { if (!isSpoke(l) && linkIsTouching(l, id)) { neighbors.add(idOf(l.source)); neighbors.add(idOf(l.target)) } })
    if (nodeSel) nodeSel.style('opacity', (n) => (!id || n.kind === 'person' || n.id === id || neighbors.has(n.id) ? 1 : 0.15))
    if (linkSel) {
      linkSel
        .style('opacity', (l) => {
          if (!id) return isSpoke(l) ? 0.45 : 0
          if (linkIsTouching(l, id)) return isSpoke(l) ? 0.7 : 0.9
          return isSpoke(l) ? 0.06 : 0
        })
        .attr('stroke', (l) => (id && !isSpoke(l) && linkIsTouching(l, id) ? 'var(--accent)' : 'var(--link)'))
    }
    document.querySelectorAll('.term-row').forEach((el) => {
      const active = id && el.dataset.id === id
      el.classList.toggle('active', !!active)
      if (active && scroll) el.scrollIntoView({ block: 'nearest' })
    })
  }

  const params = () => ({
    days: state.days, source: state.source, kind: state.kind, sort: state.sort,
    limit: state.limit, min: state.min, domain: state.domain,
  })

  let requestId = 0

  const load = async () => {
    if (!state.person) return
    const id = ++requestId
    try {
      const res = await fetch(`/api/people/${state.person}/graph?` + new URLSearchParams(params()))
      const g = await res.json()
      if (id !== requestId) return
      render(g)
      renderTerms(g)
      const srcs = await (await fetch(`/api/people/${state.person}/sources?` + new URLSearchParams(params()))).json()
      if (id === requestId) renderSources(srcs)
    } catch (e) {
      $('stats').textContent = `erro: ${e.message}`
    }
  }

  const renderSources = (rows) => {
    $('domainlabel').textContent = state.domain === 'all' ? '' : `· ${state.domain}`
    const all = [{ domain: 'all', label: 'todas', docs: rows.reduce((a, r) => a + r.docs, 0), tone: null }, ...rows]
    const box = $('sources')
    box.innerHTML = all.map((r) => `
      <div class="chip ${r.domain === state.domain ? 'active' : ''}" data-domain="${r.domain ?? ''}" title="${r.source ?? ''}" style="border-left-color:${toneColor(r.tone)}">
        <span class="d">${r.label ?? r.domain ?? r.source ?? 'desconhecido'}</span>
        <span class="n">${r.docs}</span>
        <span class="t" style="background:${toneColor(r.tone)}">${r.tone === null || r.tone === undefined ? '' : r.tone}</span>
      </div>`).join('')
    box.querySelectorAll('.chip').forEach((el) => el.addEventListener('click', () => {
      const d = el.dataset.domain
      state.domain = !d || d === state.domain ? 'all' : d
      load()
    }))
  }

  const renderTerms = (g) => {
    const box = $('terms')
    const terms = g.nodes
    $('terms-count').textContent = terms.length ? `${terms.length}` : ''
    if (!terms.length) {
      box.innerHTML = '<div class="terms-empty">sem termos nessa janela</div>'
      return
    }
    const values = terms.map((n) => (state.sort === 'pmi' ? n.pmi : n.count))
    const minV = Math.min(0, ...values)
    const maxV = Math.max(...values, 1)
    const widthScale = d3.scaleLinear().domain([minV, maxV]).range([4, 100]).clamp(true)
    box.innerHTML = terms.map((n) => {
      const v = state.sort === 'pmi' ? n.pmi : n.count
      const valueText = state.sort === 'pmi' ? (v > 0 ? '+' : '') + v.toFixed(2) : v
      const label = n.kind === 'hashtag' ? `#${n.term}` : n.term
      return `
        <div class="term-row" data-id="${n.id}" title="${label}">
          <span class="term-dot" style="background:${kindColor[n.kind]}"></span>
          <span class="term-label">${label}</span>
          <span class="term-bar-wrap"><span class="term-bar" style="width:${widthScale(v)}%;background:${kindColor[n.kind]}"></span></span>
          <span class="term-value">${valueText}</span>
          <span class="term-tone" style="background:${toneColor(n.tone)}"></span>
        </div>`
    }).join('')
    box.querySelectorAll('.term-row').forEach((el) => {
      el.addEventListener('mouseenter', () => setHighlight(el.dataset.id))
      el.addEventListener('mouseleave', () => setHighlight(null))
    })
  }

  const render = (g) => {
    if (sim) sim.stop()
    svg.selectAll('*').remove()
    $('person-name').textContent = g.person.name
    $('stats').textContent = `${g.stats.about} docs sobre ${g.person.name} de ${g.stats.docs} na janela`
    $('empty').style.display = g.nodes.length ? 'none' : 'grid'
    const [width, height] = [1200, 700]
    const cx = width / 2, cy = height / 2
    const maxCount = d3.max(g.nodes, (n) => n.count) || 1
    const r = d3.scaleSqrt().domain([1, maxCount]).range([4, 18])
    const personR = 28
    const n = g.nodes.length
    // Ring radius encodes rank by the active sort: closer to the center = stronger association.
    // Angle follows the golden angle so consecutive ranks land far apart and the layout is deterministic.
    const ring = d3.scaleLinear().domain([0, Math.max(1, n - 1)]).range([120, 310])
    const golden = Math.PI * (3 - Math.sqrt(5))
    const nodes = [
      { id: `person:${g.person.id}`, kind: 'person', term: g.person.name, fx: cx, fy: cy, x: cx, y: cy },
      ...g.nodes.map((d, i) => ({ ...d, rank: i, x: cx + ring(i) * Math.cos(i * golden), y: cy + ring(i) * Math.sin(i * golden) })),
    ]
    const byId = new Map(nodes.map((d) => [d.id, d]))
    const links = g.links.map((l) => ({ ...l, source: byId.get(l.source), target: byId.get(l.target) })).filter((l) => l.source && l.target)
    linkData = links
    const maxLink = d3.max(links.filter((l) => !isSpoke(l)), (l) => l.count) || 1
    const root = svg.append('g')
    svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', (e) => root.attr('transform', e.transform)))

    linkSel = root.append('g').selectAll('line').data(links).join('line')
      .attr('class', 'link')
      .attr('stroke', 'var(--link)')
      .attr('stroke-width', (l) => (isSpoke(l) ? 1 : 1 + 3 * Math.sqrt(l.count / maxLink)))
      .style('opacity', (l) => (isSpoke(l) ? 0.45 : 0))

    nodeSel = root.append('g').selectAll('g').data(nodes).join('g').attr('class', (d) => `node ${d.kind}`)
    nodeSel.append('circle').attr('r', (d) => (d.kind === 'person' ? personR : r(d.count))).attr('fill', nodeColor)
    nodeSel.append('text').text((d) => (d.kind === 'hashtag' ? `#${d.term}` : d.term))
    const placeLabels = () => nodeSel.select('text')
      .attr('text-anchor', (d) => (d.kind === 'person' ? 'middle' : d.x >= cx ? 'start' : 'end'))
      .attr('dx', (d) => (d.kind === 'person' ? 0 : (d.x >= cx ? 1 : -1) * (r(d.count) + 5)))
      .attr('dy', (d) => (d.kind === 'person' ? personR + 18 : 4))

    nodeSel.on('mousemove', (e, d) => {
      if (d.kind === 'person') return
      tip.style.display = 'block'
      const box = tip.parentElement.getBoundingClientRect()
      tip.style.left = e.clientX - box.left + 14 + 'px'; tip.style.top = e.clientY - box.top + 14 + 'px'
      const co = links.filter((l) => !isSpoke(l) && linkIsTouching(l, d.id)).length
      tip.innerHTML = `<b>${d.kind === 'hashtag' ? '#' : ''}${d.term}</b><br><span>docs</span> ${d.count} &nbsp; <span>pmi</span> ${d.pmi}${d.tone === null || d.tone === undefined ? '' : ` &nbsp; <span>tom</span> ${d.tone}`}<br><span>aparece junto com</span> ${co} ${co === 1 ? 'termo' : 'termos'} da lista`
    }).on('mouseenter', (e, d) => { if (d.kind !== 'person') setHighlight(d.id, { scroll: true }) })
      .on('mouseleave', () => { tip.style.display = 'none'; setHighlight(null) })

    const tick = () => {
      linkSel.attr('x1', (l) => l.source.x).attr('y1', (l) => l.source.y).attr('x2', (l) => l.target.x).attr('y2', (l) => l.target.y)
      nodeSel.attr('transform', (d) => `translate(${d.x},${d.y})`)
      placeLabels()
    }

    nodeSel.call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); if (d.kind !== 'person') { d.fx = null; d.fy = null } }))

    sim = d3.forceSimulation(nodes)
      .force('ring', d3.forceRadial((d) => (d.kind === 'person' ? 0 : ring(d.rank)), cx, cy).strength((d) => (d.kind === 'person' ? 0 : 0.9)))
      .force('together', d3.forceLink(links.filter((l) => !isSpoke(l))).id((d) => d.id).strength(0.015).distance(90))
      .force('collide', d3.forceCollide((d) => (d.kind === 'person' ? personR + 30 : r(d.count) + 20)).iterations(4))
      .on('tick', tick)
      .stop()
    sim.tick(300)
    tick()
    sim.alpha(0)

    d3.select('#legend').selectAll('.hint').data([0]).join('span').attr('class', 'hint')
      .text('perto do centro = associação mais forte · passe o mouse num termo para ver com quais ele aparece junto')
  }

  const setSegmented = (root, value) => {
    root.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.value === value))
  }

  const bindSegmented = (id, key) => {
    const root = $(id)
    root.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      state[key] = b.dataset.value
      setSegmented(root, state[key])
      load()
    }))
  }

  const renderPeople = (people) => {
    $('people').innerHTML = people.map((p) => `<button class="person-item" data-id="${p.id}"><span class="dot"></span>${p.name}</button>`).join('')
    $('people').querySelectorAll('.person-item').forEach((el) => el.addEventListener('click', () => {
      state.person = el.dataset.id
      state.domain = 'all'
      $('people').querySelectorAll('.person-item').forEach((e) => e.classList.toggle('active', e === el))
      load()
    }))
  }

  const init = async () => {
    setSegmented($('days'), state.days)
    setSegmented($('kind'), state.kind)
    setSegmented($('sort'), state.sort)
    bindSegmented('days', 'days')
    bindSegmented('kind', 'kind')
    bindSegmented('sort', 'sort')

    $('source-select').addEventListener('change', (e) => { state.source = e.target.value; load() })

    $('limit-range').addEventListener('input', (e) => { $('limit-badge').textContent = e.target.value })
    $('limit-range').addEventListener('change', (e) => { state.limit = +e.target.value; load() })
    $('min-range').addEventListener('input', (e) => { $('min-badge').textContent = e.target.value })
    $('min-range').addEventListener('change', (e) => { state.min = +e.target.value; load() })

    $('tone').addEventListener('change', () => {
      state.tone = $('tone').checked
      $('tonelegend').hidden = !state.tone
      if (nodeSel) nodeSel.select('circle').attr('fill', nodeColor)
    })

    const people = await (await fetch('/api/people')).json()
    renderPeople(people)
    if (people.length) {
      state.person = people[0].id
      $('people').querySelector('.person-item').classList.add('active')
      load()
    }
  }
  init()
</script>
</body>
</html>
