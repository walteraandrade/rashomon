<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>assoc-graph</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13; --panel: #171922; --line: #262936; --fg: #e6e7ec; --muted: #8b90a3;
    --person: #f4c95d; --hashtag: #6ee7b7; --word: #7aa2f7; --theme: #f0a0c8; --link: #3a3f52;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 Inter, system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { margin: 0 12px 0 0; font: 700 22px/1 'League Spartan', sans-serif; letter-spacing: .02em; }
  label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  select, input { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; min-width: 96px; }
  #stats { margin-left: auto; color: var(--muted); font-size: 12px; align-self: center; }
  main { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 280px; }
  #graph { position: relative; overflow: hidden; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; font-size: 12px; }
  aside h2 { margin: 0; padding: 10px 12px; font: 600 12px 'Inter', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .src { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 6px 12px; cursor: pointer; align-items: center; }
  .src:hover { background: var(--bg); }
  .src.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--person); }
  .src .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .src .t { width: 34px; text-align: center; border-radius: 4px; padding: 1px 0; font-variant-numeric: tabular-nums; font-size: 11px; }
  .src .t:empty { visibility: hidden; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { max-height: 40vh; border-left: 0; border-top: 1px solid var(--line); }
  }
  #tonetoggle { display: flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--fg); align-self: center; }
  svg { width: 100%; height: 100%; display: block; }
  .node text { fill: var(--fg); pointer-events: none; font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node.person text { font: 700 16px 'League Spartan', sans-serif; }
  #tip { position: absolute; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; pointer-events: none; }
  #tip b { color: var(--fg); } #tip span { color: var(--muted); }
  #legend { position: absolute; left: 16px; bottom: 12px; display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #empty { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>assoc-graph</h1>
  <label>Pessoa <select id="person"></select></label>
  <label>Janela <select id="days"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option><option value="365">1 ano</option></select></label>
  <label>Fonte <select id="source"><option value="all">todas</option><option value="bluesky">bluesky</option><option value="gdelt">gdelt</option><option value="rss">rss</option><option value="gnews">google news</option><option value="gkg">gdelt gkg</option></select></label>
  <label>Tipo <select id="kind"><option value="all">todos</option><option value="hashtag">hashtag</option><option value="word">palavra</option><option value="theme">tema</option></select></label>
  <label>Ordem <select id="sort"><option value="count">contagem</option><option value="pmi">pmi</option></select></label>
  <label>Nós <input id="limit" type="number" value="40" min="5" max="200"></label>
  <label>Mín. <input id="min" type="number" value="2" min="1"></label>
  <label id="tonetoggle"><input id="tone" type="checkbox"> cor por tom</label>
  <div id="stats"></div>
</header>
<main>
  <div id="graph">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tip"></div>
    <div id="empty">nada nessa janela. roda <code>&nbsp;pnpm ingest</code></div>
    <div id="legend"><span><i style="background:var(--person)"></i>pessoa</span><span><i style="background:var(--hashtag)"></i>hashtag</span><span><i style="background:var(--word)"></i>palavra</span><span><i style="background:var(--theme)"></i>tema</span><span id="tonelegend" hidden><i style="background:#f7768e"></i>tom negativo &nbsp;<i style="background:#9ece6a"></i>tom positivo</span></div>
  </div>
  <aside>
    <h2>fontes <span id="domainlabel"></span></h2>
    <div id="sources"></div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id)
  const controls = ['person', 'days', 'source', 'kind', 'sort', 'limit', 'min']
  let domain = 'all'
  const toneScale = d3.scaleLinear().domain([-3, 0, 3]).range(['#f7768e', '#565f89', '#9ece6a']).clamp(true)
  const toneColor = (t) => (t === null || t === undefined ? 'var(--line)' : toneScale(t))
  const nodeColor = (n) => ($('tone').checked && n.kind !== 'person' && n.tone !== null ? toneScale(n.tone) : color[n.kind])
  const color = { person: 'var(--person)', hashtag: 'var(--hashtag)', word: 'var(--word)', theme: 'var(--theme)' }
  const svg = d3.select('svg')
  const tip = $('tip')

  const params = () => ({ ...Object.fromEntries(controls.map((c) => [c, $(c).value])), domain })
  let requestId = 0
  let sim = null

  const load = async () => {
    const { person, ...q } = params()
    if (!person) return
    const id = ++requestId
    try {
      const res = await fetch(`/api/people/${person}/graph?` + new URLSearchParams(q))
      const g = await res.json()
      if (id !== requestId) return
      render(g)
      const srcs = await (await fetch(`/api/people/${person}/sources?` + new URLSearchParams(q))).json()
      if (id === requestId) renderSources(srcs)
    } catch (e) {
      $('stats').textContent = `erro: ${e.message}`
    }
  }


  const renderSources = (rows) => {
    $('domainlabel').textContent = domain === 'all' ? '' : `· ${domain}`
    const all = [{ domain: 'all', label: 'todas', docs: rows.reduce((a, r) => a + r.docs, 0), tone: null }, ...rows]
    const box = $('sources')
    box.innerHTML = all.map((r) => `
      <div class="src ${r.domain === domain ? 'active' : ''}" data-domain="${r.domain ?? ''}" title="${r.source ?? ''}">
        <span class="d">${r.label ?? r.domain ?? 'desconhecido'}</span>
        <span class="n">${r.docs}</span>
        <span class="t" style="background:${toneColor(r.tone)}">${r.tone === null || r.tone === undefined ? '' : r.tone}</span>
      </div>`).join('')
    box.querySelectorAll('.src').forEach((el) => el.addEventListener('click', () => {
      const d = el.dataset.domain
      domain = !d || d === domain ? 'all' : d
      load()
    }))
  }

  const render = (g) => {
    if (sim) sim.stop()
    svg.selectAll('*').remove()
    $('stats').textContent = `${g.stats.about} docs sobre ${g.person.name} de ${g.stats.docs} na janela`
    $('empty').style.display = g.nodes.length ? 'none' : 'grid'
    const [width, height] = [1200, 700]
    const maxCount = d3.max(g.nodes, (n) => n.count) || 1
    const r = d3.scaleSqrt().domain([1, maxCount]).range([5, 26])
    const nodes = [{ id: `person:${g.person.id}`, kind: 'person', term: g.person.name, fx: width / 2, fy: height / 2 }, ...g.nodes]
    const links = g.links.map((l) => ({ ...l }))
    const root = svg.append('g')
    svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', (e) => root.attr('transform', e.transform)))

    const link = root.append('g').selectAll('line').data(links).join('line')
      .attr('stroke', 'var(--link)').attr('stroke-opacity', (l) => (l.source.startsWith('person:') ? 0.5 : 0.9))
      .attr('stroke-width', (l) => Math.min(6, 0.6 + Math.sqrt(l.count)))

    const node = root.append('g').selectAll('g').data(nodes).join('g').attr('class', (n) => `node ${n.kind}`)
    const personR = 34
    node.append('circle').attr('r', (n) => (n.kind === 'person' ? personR : r(n.count))).attr('fill', nodeColor)
    node.append('text').attr('text-anchor', 'middle').attr('dy', (n) => (n.kind === 'person' ? personR + 20 : -r(n.count) - 4))
      .text((n) => (n.kind === 'hashtag' ? `#${n.term}` : n.term))

    node.on('mousemove', (e, n) => {
      if (n.kind === 'person') return
      tip.style.display = 'block'
      const box = tip.parentElement.getBoundingClientRect()
      tip.style.left = e.clientX - box.left + 14 + 'px'; tip.style.top = e.clientY - box.top + 14 + 'px'
      tip.innerHTML = `<b>${n.kind === 'hashtag' ? '#' : ''}${n.term}</b><br><span>docs</span> ${n.count} &nbsp; <span>pmi</span> ${n.pmi}${n.tone === null ? '' : ` &nbsp; <span>tom</span> ${n.tone}`}`
    }).on('mouseleave', () => (tip.style.display = 'none'))

    node.call(d3.drag()
      .on('start', (e, n) => { if (!e.active) sim.alphaTarget(0.3).restart(); n.fx = n.x; n.fy = n.y })
      .on('drag', (e, n) => { n.fx = e.x; n.fy = e.y })
      .on('end', (e, n) => { if (!e.active) sim.alphaTarget(0); if (n.kind !== 'person') { n.fx = null; n.fy = null } }))

    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id((n) => n.id).distance((l) => (String(l.source.id).startsWith('person:') ? 160 : 70)).strength((l) => (String(l.source.id).startsWith('person:') ? 0.3 : 0.03)))
      .force('charge', d3.forceManyBody().strength(-160))
      .force('radial', d3.forceRadial(200, width / 2, height / 2).strength((n) => (n.kind === 'person' ? 0 : 0.5)))
      .force('collide', d3.forceCollide((n) => (n.kind === 'person' ? personR + 40 : r(n.count) + 10)))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .on('tick', () => {
        link.attr('x1', (l) => l.source.x).attr('y1', (l) => l.source.y).attr('x2', (l) => l.target.x).attr('y2', (l) => l.target.y)
        node.attr('transform', (n) => `translate(${n.x},${n.y})`)
      })
  }

  const init = async () => {
    const people = await (await fetch('/api/people')).json()
    $('person').innerHTML = people.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')
    $('person').addEventListener('change', () => (domain = 'all'))
    controls.forEach((c) => $(c).addEventListener('change', load))
    $('tone').addEventListener('change', () => {
      $('tonelegend').hidden = !$('tone').checked
      svg.selectAll('.node circle').attr('fill', nodeColor)
    })
    load()
  }
  init()
</script>
</body>
</html>
